<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><main>
<figure class="ae-embed"><div class="ae-stage" id="ae-stage"><img class="ae-fallimg" id="ae-fall" src="/images/proj/orb.webp" alt="Static preview of the vertex-streaming decode viewer" hidden><span class="ae-badge" id="ae-badge">MESHOPT · vertices snap to GPU-ready order</span><div class="ae-ctrls"><button id="ae-btn-mesh" class="on" type="button">Meshopt path</button><button id="ae-btn-draco" type="button">Draco path</button></div></div><figcaption>Vertices streaming in and assembling into the model surface — a real Three.js r160 scene, not a benchmark. Toggle the decode path to change how the mesh reconstructs.</figcaption></figure>
<div class="credit">Live Three.js r160 + WebGL — by <a href="https://aetumi.app">AETumi</a> · <a href="https://aetumi.app/news/draco-vs-meshopt/">article</a></div>
</main>
<script type="module">
const stage=document.getElementById('ae-stage');
const fall=document.getElementById('ae-fall');
const badge=document.getElementById('ae-badge');
const bMesh=document.getElementById('ae-btn-mesh');
const bDraco=document.getElementById('ae-btn-draco');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let renderer,scene,camera,group,points,surface,edges,raf=0;
let target,scatter,delay,count=0;
const maxDelay=0.5;
let mode='mesh',start=0;
const clamp01=v=>v<0?0:v>1?1:v;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const smooth=(a,b,x)=>{x=clamp01((x-a)/(b-a));return x*x*(3-2*x);};
async function boot(){
  let THREE;
  try{ THREE=await import('three'); }catch(e){ return showFallback(); }
  try{
    const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    if(!renderer.getContext()) return showFallback();
    const w=stage.clientWidth,h=stage.clientHeight;
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(w,h,false);
    stage.insertBefore(renderer.domElement,stage.firstChild);
    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(45,w/h,0.1,100);
    camera.position.set(0,0,4.4);
    scene.add(new THREE.AmbientLight(0xffffff,0.75));
    const key=new THREE.DirectionalLight(0xff8ad0,1.5); key.position.set(3,4,5); scene.add(key);
    const rim=new THREE.DirectionalLight(0xc04df0,0.85); rim.position.set(-4,-2,-3); scene.add(rim);
    group=new THREE.Group(); scene.add(group);
    // target surface: a faceted sphere (deliberately NOT a torus knot)
    const src=new THREE.IcosahedronGeometry(1.28,3);
    target=src.attributes.position.array.slice(0);
    count=target.length/3;
    scatter=new Float32Array(target.length);
    delay=new Float32Array(count);
    const v=new THREE.Vector3();
    for(let i=0;i<count;i++){
      const i3=i*3;
      v.set(target[i3],target[i3+1],target[i3+2]).normalize();
      const r=2.4+Math.random()*1.6;
      scatter[i3]=v.x*r+(Math.random()-0.5)*1.2;
      scatter[i3+1]=v.y*r+(Math.random()-0.5)*1.2;
      scatter[i3+2]=v.z*r+(Math.random()-0.5)*1.2;
      delay[i]=Math.random()*maxDelay;
    }
    const pg=new THREE.BufferGeometry();
    pg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(target.length),3));
    points=new THREE.Points(pg,new THREE.PointsMaterial({color:0xff5ea8,size:0.045,sizeAttenuation:true,transparent:true,opacity:1,depthWrite:false}));
    group.add(points);
    surface=new THREE.Mesh(src,new THREE.MeshStandardMaterial({color:0xc04df0,metalness:0.35,roughness:0.35,transparent:true,opacity:0,flatShading:true}));
    group.add(surface);
    edges=new THREE.LineSegments(new THREE.WireframeGeometry(src),new THREE.LineBasicMaterial({color:0xff7ad0,transparent:true,opacity:0}));
    group.add(edges);
    const controls=new OrbitControls(camera,renderer.domElement);
    controls.enableZoom=false; controls.enablePan=false;
    controls.autoRotate=!reduce; controls.autoRotateSpeed=1.1;
    addEventListener('resize',onResize);
    start=performance.now();
    if(reduce){ stream(1); controls.update(); renderer.render(scene,camera); }
    else{
      const loop=(now)=>{
        const period=mode==='draco'?6.8:4.6;
        let tt=(((now-start)/1000)%period)/period, p;
        if(tt<0.58) p=tt/0.58;
        else if(tt<0.80) p=1;
        else p=1-(tt-0.80)/0.20;
        stream(p);
        controls.update(); renderer.render(scene,camera);
        raf=requestAnimationFrame(loop);
      };
      raf=requestAnimationFrame(loop);
    }
  }catch(e){ showFallback(); }
}
function stream(p){
  const pos=points.geometry.attributes.position.array;
  for(let i=0;i<count;i++){
    const i3=i*3;
    const local=mode==='draco'?clamp01((p-delay[i])/(1-maxDelay)):clamp01(p*1.05);
    const e=easeOutCubic(local);
    pos[i3]=scatter[i3]+(target[i3]-scatter[i3])*e;
    pos[i3+1]=scatter[i3+1]+(target[i3+1]-scatter[i3+1])*e;
    pos[i3+2]=scatter[i3+2]+(target[i3+2]-scatter[i3+2])*e;
  }
  points.geometry.attributes.position.needsUpdate=true;
  paint(p);
}
function paint(p){
  points.material.opacity=1-smooth(0.72,1.0,p)*0.85;
  surface.material.opacity=smooth(0.66,1.0,p)*0.92;
  const edgeMax=mode==='draco'?0.9:0.22;
  edges.material.opacity=smooth(0.25,0.95,p)*edgeMax;
}
function onResize(){ if(!renderer) return; const w=stage.clientWidth,h=stage.clientHeight; camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h,false); }
function showFallback(){ if(raf)cancelAnimationFrame(raf); fall.hidden=false; }
function setPath(kind){
  mode=kind;
  if(kind==='draco'){ badge.textContent='DRACO · rebuild connectivity, vertices lock in region by region'; bDraco.classList.add('on'); bMesh.classList.remove('on'); }
  else{ badge.textContent='MESHOPT · light unpack, vertices snap to GPU-ready order'; bMesh.classList.add('on'); bDraco.classList.remove('on'); }
  start=performance.now();
}
bMesh.addEventListener('click',()=>setPath('mesh'));
bDraco.addEventListener('click',()=>setPath('draco'));
if('IntersectionObserver' in window){ const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){io.disconnect();boot();}});},{threshold:.1}); io.observe(stage);} else { boot(); }
</script>
