<main>
<figure class="ae-fig"><div class="ae-live3d"><span class="ae-3dtag">Live · Three.js · wireframe decimation</span><canvas id="ae3d_lod" role="img" aria-label="AETumi live Three.js scene: one icosphere model drawn as a wireframe whose triangle density drops from a dense high-poly mesh to a light optimized mesh, with a live triangle counter"></canvas><div class="ae-3dstat" id="ae3d_stat">loading…</div><div class="ae-3dctl" role="group" aria-label="Model detail level"><button data-q="0">Low</button><button data-q="1">Balanced</button><button data-q="2" class="on">High</button></div><div class="ae-3dfb" id="ae3d_fb">Interactive 3D model — enable WebGL and JavaScript to watch triangle density collapse across detail tiers. A static AERAE preview is shown in the media proof below.</div></div><figcaption>Live decimation demo — one icosphere model drawn as a wireframe at three geometry densities. It auto-steps High â†’ Balanced â†’ Low (or use the buttons) and the counter shows the triangle count collapsing from 5,120 down to 80 as the mesh is optimized. Real Three.js, rendered in your browser, not a video.</figcaption></figure>
<div class="credit">Live Three.js r160 + WebGL — by <a href="https://aetumi.app">AETumi</a> · <a href="https://aetumi.app/news/optimize-gltf-glb-threejs/">article</a></div>
</main>
<script type="module">
import * as THREE from 'three';
(function(){
  var canvas = document.getElementById('ae3d_lod');
  var statEl = document.getElementById('ae3d_stat');
  var fbEl   = document.getElementById('ae3d_fb');
  var ctl    = document.querySelector('.ae-3dctl');
  if(!canvas) return;
  // WebGL support probe + graceful fallback
  try {
    var test = document.createElement('canvas');
    if(!(test.getContext('webgl') || test.getContext('experimental-webgl'))) return;
  } catch(e){ return; }
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true }); }
  catch(e){ return; }
  if(fbEl) fbEl.style.display = 'none';                  // init succeeded: hide fallback
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new THREE.Scene();
  var cam = new THREE.PerspectiveCamera(50, 16/9, 0.1, 100);
  cam.position.set(0, 0, 4.2);
  scene.add(new THREE.HemisphereLight(0xbfe9ff, 0x0a0a18, 1.1));
  var dir = new THREE.DirectionalLight(0xffffff, 0.9); dir.position.set(3, 4, 3); scene.add(dir);
  // three DETAIL levels of the SAME icosphere model - decimation made visible.
  // IcosahedronGeometry(radius, detail): triangle count = 20 * (detail+1)^2
  var tiers = [ { label:'Low', detail:1, tex:'512Â²' },
                { label:'Balanced', detail:5, tex:'1024Â²' },
                { label:'High', detail:15, tex:'2048Â²' } ];
  var wireMat = new THREE.MeshBasicMaterial({ color: 0x33e1ff, wireframe: true, transparent: true, opacity: 0.92 });
  var fillMat = new THREE.MeshStandardMaterial({ color: 0x07161c, roughness: 0.6, metalness: 0.2, emissive: 0x0c3d44, emissiveIntensity: 0.45, transparent: true, opacity: 0.55 });
  var group = new THREE.Group(); scene.add(group);
  var meshes = tiers.map(function(t){
    var g = new THREE.IcosahedronGeometry(1.35, t.detail);
    var holder = new THREE.Group();
    holder.add(new THREE.Mesh(g, fillMat));
    holder.add(new THREE.Mesh(g, wireMat));
    holder.visible = false;
    holder.userData.tris = g.index ? g.index.count/3 : g.attributes.position.count/3;
    group.add(holder); return holder;
  });
  var labels = tiers.map(function(t){ return t.label; });
  var current = 2, auto = true;                          // start High, auto-decimate until user acts
  function show(q){
    meshes.forEach(function(m,i){ m.visible = (i===q); });
    current = q;
    var t = tiers[q];
    if(statEl) statEl.textContent = t.label + ' · ' + Math.round(meshes[q].userData.tris).toLocaleString() + ' triangles · tex ' + t.tex;
    if(ctl) ctl.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', +b.dataset.q === q); });
  }
  if(ctl) ctl.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return; auto = false; show(+b.dataset.q);
  });
  show(2);
  var order = [2,1,0], oi = 0, acc = 0;                  // High -> Balanced -> Low, density visibly drops
  function size(){
    var w = canvas.clientWidth, h = canvas.clientHeight || Math.round(w*9/16);
    renderer.setSize(w, h, false); cam.aspect = w/Math.max(1,h); cam.updateProjectionMatrix();
  }
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
  var vis = true;
  try { new IntersectionObserver(function(en){ vis = en[0].isIntersecting; }).observe(canvas); } catch(e){}
  try { new ResizeObserver(function(){ size(); }).observe(canvas); } catch(e){ window.addEventListener('resize', size); }
  var last = performance.now();
  function loop(now){
    requestAnimationFrame(loop);                         // single rAF
    if(!vis || canvas.clientHeight < 2) return;          // IO gate
    var dt = (now - last)/1000; last = now;
    if(!reduce){ group.rotation.y += 0.25*dt; group.rotation.x = 0.32; }
    if(auto && !reduce){ acc += dt; if(acc >= 1.6){ acc = 0; oi = (oi+1)%order.length; show(order[oi]); } }
    renderer.render(scene, cam);
  }
  size();
  if(reduce){ show(2); group.rotation.set(0.32, 0.6, 0); }  // reduced-motion: static high-poly
  requestAnimationFrame(loop);
})();
</script>
