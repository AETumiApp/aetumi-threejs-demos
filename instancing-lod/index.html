<main>
<figure class="ae-fig"><div class="ae-live3d"><canvas id="aefield" role="img" aria-label="AETumi live Three.js scene: an instanced field of thousands of objects rendered in a single draw call with distance-based level of detail"></canvas><div class="ae-hud" id="aehud" aria-hidden="true">Draw calls <b id="hcalls">–</b><br>Instances <b id="hins">–</b><br><span class="lo">high-LOD</span> <b id="hhi">–</b> · <span class="lo">low-LOD</span> <b id="hlo">–</b></div><div class="ae-fallback" id="aefb">Your browser could not start WebGL. The instanced field renders live where WebGL is available; the techniques below work without it.</div></div><figcaption>Live instanced field &mdash; thousands of objects drawn in one to two draw calls, with distant instances simplified by LOD. The counter reads <code>renderer.info.render.calls</code> from the real render loop.</figcaption></figure>
<div class="credit">Live Three.js r160 + WebGL — by <a href="https://aetumi.app">AETumi</a> · <a href="https://aetumi.app/news/threejs-performance-instancing-lod/">article</a></div>
</main>
<script type="module">
import * as THREE from 'three';
(function(){
  const canvas=document.getElementById('aefield');
  const hud={c:document.getElementById('hcalls'),i:document.getElementById('hins'),hi:document.getElementById('hhi'),lo:document.getElementById('hlo')};
  const fb=document.getElementById('aefb');
  let renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'}); }
  catch(e){ fb.style.display='flex'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(52,16/9,0.1,200);
  scene.add(new THREE.HemisphereLight(0xbfd0ff,0x0a0f1e,1.15));
  const dir=new THREE.DirectionalLight(0xffffff,1.1); dir.position.set(4,7,3); scene.add(dir);

  // --- build an instanced field: near = high LOD, far = low LOD ---
  const SIDE=46, GAP=0.62, HALF=(SIDE-1)*GAP/2, NEAR=8.5;
  const hiGeo=new THREE.IcosahedronGeometry(0.2,2);   // smooth, more triangles
  const loGeo=new THREE.IcosahedronGeometry(0.2,0);   // faceted, fewer triangles
  const mat=new THREE.MeshStandardMaterial({metalness:0.55,roughness:0.35,color:0x5ea0ff,emissive:0x14243f,emissiveIntensity:0.6});
  const cells=[];
  for(let x=0;x<SIDE;x++)for(let z=0;z<SIDE;z++){
    const px=x*GAP-HALF, pz=z*GAP-HALF, d=Math.hypot(px,pz);
    cells.push({px,pz,d,hi:d<NEAR});
  }
  const hiCount=cells.filter(c=>c.hi).length, loCount=cells.length-hiCount;
  const hiMesh=new THREE.InstancedMesh(hiGeo,mat,hiCount);
  const loMesh=new THREE.InstancedMesh(loGeo,mat,loCount);
  hiMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  loMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(hiMesh,loMesh);
  const dummy=new THREE.Object3D();
  const list=[]; let hi=0,lo=0;
  for(const c of cells){ const m=c.hi?hiMesh:loMesh, idx=c.hi?hi++:lo++; list.push({...c,mesh:m,idx}); }
  function place(t){
    for(const c of list){
      const y=Math.sin(c.d*0.9-t*1.6)*0.45;
      dummy.position.set(c.px,y,c.pz);
      dummy.rotation.y=t*0.4+c.d*0.2;
      dummy.updateMatrix();
      c.mesh.setMatrixAt(c.idx,dummy.matrix);
    }
    hiMesh.instanceMatrix.needsUpdate=true;
    loMesh.instanceMatrix.needsUpdate=true;
  }

  function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight||1; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let visible=true;
  try{ new IntersectionObserver(function(e){visible=e[0].isIntersecting;},{threshold:0.05}).observe(canvas); }catch(e){}
  try{ new ResizeObserver(resize).observe(canvas); }catch(e){ window.addEventListener('resize',resize); }
  function hudUpdate(){ if(hud.c)hud.c.textContent=renderer.info.render.calls; if(hud.i)hud.i.textContent=cells.length; if(hud.hi)hud.hi.textContent=hiCount; if(hud.lo)hud.lo.textContent=loCount; }
  let running=false;
  function frame(t){ if(!running)return; requestAnimationFrame(frame); if(!visible||canvas.clientHeight<2)return; const time=t*0.001; camera.position.set(Math.sin(time*0.15)*16,9.5,Math.cos(time*0.15)*16); camera.lookAt(0,0,0); place(time); renderer.render(scene,camera); hudUpdate(); }
  function start(){ resize(); if(reduce){ camera.position.set(11,9.5,13); camera.lookAt(0,0,0); place(0.6); renderer.render(scene,camera); hudUpdate(); return; } running=true; requestAnimationFrame(frame); }
  requestAnimationFrame(start);
})();
</script>
