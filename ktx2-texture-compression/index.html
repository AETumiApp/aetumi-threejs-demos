<main>
<figure class="ae-fig"><div class="ae-live3d" id="ktx2-hero-box"><canvas id="ktx2-hero" role="img" aria-label="Live WebGL scene: a plane stepping through texture compression tiers next to a stacked mipmap pyramid of shrinking textured quads"></canvas><div class="ae-3d-fb">Live texture demo needs WebGL. The left plane steps through RGBA8, ETC1S, UASTC and KTX2 quality tiers; the right stack shows the mipmap pyramid.</div></div><figcaption>Live Three.js scene — left: one plane cycling RGBA8 â†’ ETC1S â†’ UASTC â†’ KTX2 so the block artifacts and clean tiers are visible; right: a stacked mipmap pyramid of shrinking textured quads. Real-time WebGL, not a video.</figcaption></figure>
<div class="credit">Live Three.js r160 + WebGL — by <a href="https://aetumi.app">AETumi</a> · <a href="https://aetumi.app/news/ktx2-basis-texture-compression-threejs/">article</a></div>
</main>
<script type="module">
import * as THREE from 'three';
(function(){
  const canvas = document.getElementById('ktx2-hero');
  const box = document.getElementById('ktx2-hero-box');
  if(!canvas||!box) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function basePattern(size){
    const c = Object.assign(document.createElement('canvas'), {width:size,height:size});
    const x = c.getContext('2d');
    x.fillStyle='#141017'; x.fillRect(0,0,size,size);
    const s=size/8;
    for(let j=0;j<8;j++)for(let i=0;i<8;i++){x.fillStyle=(i+j)%2?'#ffb84d':'#ff8a3d';x.globalAlpha=0.25+0.75*Math.abs(Math.sin((i+1)*(j+1)));x.fillRect(i*s+2,j*s+2,s-4,s-4);}
    x.globalAlpha=1;x.strokeStyle='#ffd9a0';x.lineWidth=size/128;
    for(let r=size/12;r<size;r+=size/12){x.beginPath();x.arc(size/2,size/2,r,0,6.2832);x.stroke();}
    return c;
  }
  function labelStrip(x,size,label){x.fillStyle='rgba(10,7,14,.82)';x.fillRect(0,size-30,size,30);x.fillStyle='#ffb84d';x.font='700 15px system-ui';x.textAlign='center';x.fillText(label,size/2,size-10);}
  function blockify(src,block,steps,label){
    const size=src.width;const c=Object.assign(document.createElement('canvas'),{width:size,height:size});const x=c.getContext('2d');
    const d=src.getContext('2d').getImageData(0,0,size,size).data;
    for(let by=0;by<size;by+=block)for(let bx=0;bx<size;bx+=block){let r=0,g=0,b=0,n=0;
      for(let y=0;y<block;y++)for(let xx=0;xx<block;xx++){const p=((by+y)*size+(bx+xx))*4;r+=d[p];g+=d[p+1];b+=d[p+2];n++;}
      const q=v=>Math.round(Math.round((v/n)/255*steps)/steps*255);x.fillStyle='rgb('+q(r)+','+q(g)+','+q(b)+')';x.fillRect(bx,by,block,block);}
    labelStrip(x,size,label);return c;
  }
  let renderer;
  try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});}
  catch(e){box.classList.add('ae-3d-fallback');return;}
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(45,16/9,0.1,100);cam.position.set(0,0,6);
  const base=basePattern(256);
  const clean=(function(){const c=basePattern(256);labelStrip(c.getContext('2d'),256,'RGBA8 · uncompressed');return c;})();
  const kt=(function(){const c=basePattern(256);labelStrip(c.getContext('2d'),256,'KTX2 · GPU native');return c;})();
  const tiers=[clean,blockify(base,16,4,'ETC1S · blocky'),blockify(base,4,16,'UASTC · near-lossless'),kt].map(function(cv){var t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;});
  const planeMat=new THREE.MeshBasicMaterial({map:tiers[0]});
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(3.4,3.4),planeMat);plane.position.x=-2.1;scene.add(plane);
  const pyr=new THREE.Group();pyr.position.x=2.2;
  [256,128,64,32,16,8].forEach(function(sz,i){const cv=Object.assign(document.createElement('canvas'),{width:sz,height:sz});cv.getContext('2d').drawImage(base,0,0,sz,sz);var t=new THREE.CanvasTexture(cv);t.magFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;var w=2.6*Math.pow(0.72,i);var q=new THREE.Mesh(new THREE.PlaneGeometry(w,w),new THREE.MeshBasicMaterial({map:t}));q.position.set(0,1.7-i*0.62,-i*0.34);pyr.add(q);});
  scene.add(pyr);
  let vis=true;
  try{new IntersectionObserver(function(e){vis=e[0].isIntersecting;}).observe(canvas);}catch(e){}
  let tier=0,last=0,lw=0,lh=0;
  function frame(t){
    if(!vis){requestAnimationFrame(frame);return;}
    var w=box.clientWidth,h=box.clientHeight;
    if(w>=2&&h>=2&&(w!==lw||h!==lh)){lw=w;lh=h;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
    if(reduce){if(lw){renderer.render(scene,cam);}else{requestAnimationFrame(frame);}return;}
    if(t-last>1600){last=t;tier=(tier+1)%tiers.length;planeMat.map=tiers[tier];planeMat.needsUpdate=true;}
    plane.rotation.y=Math.sin(t/1400)*0.25;pyr.rotation.y=Math.sin(t/1800)*0.20;
    renderer.render(scene,cam);requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
