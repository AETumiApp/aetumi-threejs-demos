</head><body>
<main>
<figure class="ae-embed"><span class="tag">Live · Three.js r160 · scene graph</span><div class="stage" id="ae-stage"><canvas id="ae-canvas" role="img" aria-label="An interactive Three.js scene graph: labelled node boxes — scene, world, camera, rig, mesh, light, core and a satellite — connected by lines into a parent-to-child tree. One root group rotates and every descendant node and connecting line inherits the transform, while one branch's subtree lights up at a time."></canvas><div class="fallback" id="ae-fallback" style="background:radial-gradient(80% 70% at 50% 45%,#241a44 0%,#141019 60%,#0b0a10 100%)">Your browser could not start WebGL, so this interactive scene is showing its static description instead: labelled node boxes connected by lines into a scene-graph tree — a rotating root group whose world, camera, rig, mesh, light, core and satellite nodes all inherit its transform, with one branch highlighted at a time.</div></div><figcaption>Live hero — a Three.js scene graph as labelled node boxes wired into a parent â†’ child tree; the root group rotates and every descendant node and connector moves with it. Hover a node to light its subtree.</figcaption></figure>
<div class="credit">Live Three.js r160 + WebGL — by <a href="https://aetumi.app">AETumi</a> · <a href="https://aetumi.app/news/threejs-architecture/">article</a></div>
</main>
<script type="module">
import * as THREE from 'three';
(function(){
  const canvas = document.getElementById('ae-canvas');
  const stage  = document.getElementById('ae-stage');
  const fallback = document.getElementById('ae-fallback');
  if (!canvas || !stage) return;
  let gl = null;
  try { gl = canvas.getContext('webgl2') || canvas.getContext('webgl'); } catch (e) { gl = null; }
  if (!gl) { if (fallback) fallback.style.display = 'grid'; return; }

  const VIOLET = 0x7c5cff, LILAC = 0xa56bff, BASE_EMIT = 0x2a2150;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));   // cap DPR
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0a10);
  const camera = new THREE.PerspectiveCamera(42, 16/10, 0.1, 100);
  camera.position.set(0, 0.15, 8.6);

  scene.add(new THREE.HemisphereLight(0xc9bcff, 0x141018, 1.15));
  const key = new THREE.DirectionalLight(0xffffff, 1.35); key.position.set(3, 5, 4); scene.add(key);

  // ---- a labelled node = a small box + a text sprite ----
  const boxGeo = new THREE.BoxGeometry(0.62, 0.62, 0.62);
  const nodeMeshes = [];
  function makeLabel(text){
    const c = document.createElement('canvas'); c.width = 256; c.height = 72;
    const x = c.getContext('2d');
    x.font = 'bold 30px Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = '#f5f4f7'; x.fillText(text, 128, 40);
    const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
    spr.scale.set(1.5, 0.42, 1); spr.position.set(0, 0.66, 0);
    return spr;
  }
  function node(label){
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: VIOLET, roughness: 0.35, metalness: 0.25, emissive: new THREE.Color(BASE_EMIT), emissiveIntensity: 0.4 });
    const box = new THREE.Mesh(boxGeo, mat);
    box.userData.node = true; box.userData.mat = mat;
    g.add(box); g.add(makeLabel(label));
    nodeMeshes.push(box);
    return g;
  }
  // parent a child AND draw its connector in the parent's local space, so the
  // line inherits every transform the parent receives — that IS the scene graph.
  function connect(parentGroup, childGroup){
    const geo = new THREE.BufferGeometry().setFromPoints([ new THREE.Vector3(0,0,0), childGroup.position.clone() ]);
    parentGroup.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: LILAC, transparent: true, opacity: 0.5 })));
    parentGroup.add(childGroup);
  }

  // ---- build the tree: root -> {world, camera, rig}; world -> {mesh, light}; rig -> core -> satellite
  const root = new THREE.Group(); scene.add(root);
  const rootNode = node('scene'); rootNode.position.set(0, 1.9, 0); root.add(rootNode); // on the rotation axis

  const world  = node('world');  world.position.set(-2.4, -0.1, 0.2);
  const camN   = node('camera'); camN.position.set(0, -0.1, -1.8);
  const rig    = node('rig');    rig.position.set(2.4, -0.1, 0.2);
  connect(rootNode, world); connect(rootNode, camN); connect(rootNode, rig);

  const mesh  = node('mesh');  mesh.position.set(-1.0, -1.7, 0.1);
  const light = node('light'); light.position.set(0.7, -1.7, -0.3);
  connect(world, mesh); connect(world, light);

  const core = node('core'); core.position.set(0.2, -1.7, 0.3);
  connect(rig, core);
  const sat = node('satellite'); sat.position.set(1.15, -0.2, 0.0);
  connect(core, sat);   // deepest node: it orbits with core, which follows rig, which follows root

  const subtrees = [world, camN, rig];   // top-level branches the auto-highlight cycles through
  function resetAll(){
    for (const m of nodeMeshes){ m.userData.mat.emissive.setHex(BASE_EMIT); m.userData.mat.emissiveIntensity = 0.4; m.scale.setScalar(1); }
  }
  function lightSubtree(group){
    group.traverse((o)=>{ if (o.isMesh && o.userData.node){ o.userData.mat.emissive.setHex(LILAC); o.userData.mat.emissiveIntensity = 1.05; o.scale.setScalar(1.12); } });
  }

  // ---- hover: light the hovered node's whole subtree ----
  const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2(); let hovered = null;
  canvas.addEventListener('pointermove', (ev)=>{
    const r = canvas.getBoundingClientRect();
    ndc.x = ((ev.clientX - r.left)/r.width)*2 - 1;
    ndc.y = -((ev.clientY - r.top)/r.height)*2 + 1;
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(nodeMeshes, false)[0];
    hovered = hit ? hit.object.parent : null;   // the node group
  }, { passive: true });
  canvas.addEventListener('pointerleave', ()=>{ hovered = null; }, { passive: true });

  function size(){
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  size();

  const clock = new THREE.Clock();
  let rafId = null, visible = true, autoIdx = 0, lastSwap = 0;
  function draw(t){
    root.rotation.y = t * 0.32;                    // rotate the ROOT — the whole tree inherits it
    root.rotation.x = Math.sin(t * 0.35) * 0.09;
    resetAll();
    if (hovered){ lightSubtree(hovered); }
    else {
      if (t - lastSwap > 2.3){ lastSwap = t; autoIdx = (autoIdx + 1) % subtrees.length; }
      lightSubtree(subtrees[autoIdx]);
    }
    renderer.render(scene, camera);                // the ONLY render() call
  }
  function frame(){ draw(clock.getElapsedTime()); rafId = requestAnimationFrame(frame); }
  function start(){ if (rafId == null && visible && !document.hidden) rafId = requestAnimationFrame(frame); }
  function stop(){ if (rafId != null){ cancelAnimationFrame(rafId); rafId = null; } }

  if (reduceMotion){ draw(0.6); }                  // one representative static frame, no animation
  else {
    const io = new IntersectionObserver((es)=>{ visible = es[0].isIntersecting; visible ? start() : stop(); }, { threshold: 0.05 });
    io.observe(stage);
    document.addEventListener('visibilitychange', ()=>{ document.hidden ? stop() : start(); });
    start();
  }
  addEventListener('resize', size, { passive: true });
})();
</script>
